<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Abdullah-Al-Foysal Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="pfont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style id="pstyle">
/* Layout: a single column read like an engineer's drawing sheet: title block on top, ruled sections below. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --fg: #12201E;
  --muted: #55655F;
  --line: #CBD6D2;
  --ink: #0D4F4A;
  --spark: #C9780F;
  --on-ink: #FFFFFF;
  --font-display: "Space Grotesk", "Hind Siliguri", system-ui, sans-serif;
  --font-body: "Hind Siliguri", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1615; --surface: #152120; --fg: #E6EFEC; --muted: #9AB0A9;
    --line: #2A3B38; --ink: #5CC2B8; --spark: #F0A64A; --on-ink: #0E1615;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1615; --surface: #152120; --fg: #E6EFEC; --muted: #9AB0A9;
  --line: #2A3B38; --ink: #5CC2B8; --spark: #F0A64A; --on-ink: #0E1615;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.65;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 920px; margin: 0 auto; }
a { color: var(--ink); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--spark); outline-offset: 3px; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header { padding-block: 40px 28px; display: grid; grid-template-columns: 1fr auto; gap: 24px 40px; align-items: center; border-bottom: 2px solid var(--fg); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 6vw, 52px); line-height: 1.08; margin: 10px 0 14px; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.role { font-size: 19px; margin: 0; }
.role b { font-weight: 600; }
.role span { display: block; color: var(--muted); font-size: 16px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--ink); color: var(--on-ink); font: 600 15px var(--font-body); text-decoration: none; cursor: pointer; }
.btn.alt { background: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.1); }
.sld { width: 210px; height: auto; max-width: 100%; }
.photo { display: block; width: 220px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }

section { padding-block: 36px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px 32px; }
section > .mono { padding-top: 8px; }
h2 { font-family: var(--font-display); font-size: 26px; margin: 0 0 14px; letter-spacing: -.01em; }
p { margin: 0 0 12px; }
.lead { font-size: 18px; max-width: 62ch; }

.skills { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.skills li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }

.projects { display: grid; gap: 16px; }
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0; }
.proj h3 { font-family: var(--font-display); font-size: 19px; margin: 6px 0 4px; line-height: 1.3; }
.proj .where { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0 0 14px; }
.tags li { font-size: 13.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); }
.proj a.view { font-weight: 600; }

.jobs { list-style: none; padding: 0; margin: 0; }
.jobs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 14px; border-top: 1px solid var(--line); }
.jobs li:first-child { border-top: 0; padding-top: 0; }
.jobs b { font-weight: 600; }
.jobs .org { color: var(--muted); }
.badge { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--spark); align-self: start; padding-top: 4px; }

.row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row .v { overflow-wrap: anywhere; }
.copy { font: 500 13px var(--font-body); padding: 5px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.copy:hover { border-color: var(--ink); }
footer { padding-block: 28px 44px; color: var(--muted); font-size: 14px; }

/* Owner-only editor */
.edit-fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
#editor { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#editor .inner { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
#editor h2 { font-size: 22px; margin: 18px 0 0; }
.bar { position: sticky; top: 0; background: var(--bg); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-block: 10px; border-bottom: 1px solid var(--line); z-index: 2; }
.bar .status { color: var(--muted); font-size: 14px; flex: 1; min-width: 140px; }
.f { display: grid; gap: 4px; }
.f > span { font-size: 13px; color: var(--muted); }
.f input, .f textarea { width: 100%; font: 16px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.sm { font: 500 13px var(--font-body); padding: 5px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.sm.danger { color: #B3261E; }
:root[data-theme="dark"] .sm.danger { color: #FF8A80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sm.danger { color: #FF8A80; } }

@media (max-width: 720px) {
  header { grid-template-columns: 1fr; }
  .sld { width: 170px; }
  .photo { width: 170px; }
  section { grid-template-columns: minmax(0, 1fr); }
  section > .mono { padding-top: 0; }
  .skills { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .mono { grid-column: 1 / -1; }
}

/* Edit password gate */
#pw-gate{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#pw-gate[hidden]{display:none}
#pw-gate .box{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(360px,100%);display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#pw-gate h3{margin:0;font-family:var(--font-display);font-size:19px}
#pw-gate input{width:100%;font:16px var(--font-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
#pw-gate .msg{min-height:20px;font-size:14px;color:#B3261E;margin:0}
#pw-gate .acts{display:flex;gap:10px;justify-content:flex-end}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

  var codeHTML = document.getElementById('code').outerHTML;
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var app = document.getElementById('app');
  var editor = document.getElementById('editor');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function bare(u) { return String(u || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''); }

  var SLD = '<svg class="sld" viewBox="0 0 210 250" role="img" aria-label="Single line diagram: supply, transformer, breaker, loads" fill="none" stroke="var(--ink)" stroke-width="2">' +
    '<line x1="105" y1="8" x2="105" y2="44"/><line x1="85" y1="8" x2="125" y2="8" stroke="var(--spark)" stroke-width="3"/>' +
    '<circle cx="105" cy="62" r="18"/><circle cx="105" cy="84" r="18"/><line x1="105" y1="102" x2="105" y2="124"/>' +
    '<rect x="95" y="124" width="20" height="26" fill="var(--bg)"/><line x1="105" y1="150" x2="105" y2="172"/>' +
    '<line x1="30" y1="172" x2="180" y2="172" stroke-width="4"/>' +
    '<line x1="45" y1="172" x2="45" y2="214"/><line x1="105" y1="172" x2="105" y2="214"/><line x1="165" y1="172" x2="165" y2="214"/>' +
    '<path d="M37 214h16l-8 16z" fill="var(--ink)"/><path d="M97 214h16l-8 16z" fill="var(--ink)"/><path d="M157 214h16l-8 16z" fill="var(--ink)"/></svg>';

  function render(d) {
    var h = '<div class="wrap">';
    h += '<header><div><span class="mono">' + esc(d.eyebrow) + '</span><h1>' + esc(d.name) + '</h1>' +
      '<p class="role"><b>' + esc(d.role) + '</b>' + (d.org ? ', ' + esc(d.org) : '') + (d.subline ? '<span>' + esc(d.subline) + '</span>' : '') + '</p>' +
      '<div class="cta"><a class="btn" href="#contact">Contact me</a><a class="btn alt" href="#projects">View projects</a></div></div>' + (/^data:image\//.test(d.photo || '') ? '<img class="photo" alt="' + esc(d.name) + '" src="' + esc(d.photo) + '">' : SLD) + '</header>';

    h += '<section id="about"><span class="mono">About</span><div><h2>Who I am</h2>';
    (d.about || []).forEach(function (p, i) { h += '<p' + (i === 0 ? ' class="lead"' : '') + '>' + esc(p) + '</p>'; });
    h += '</div></section>';

    h += '<section id="skills"><span class="mono">Skills</span><div><h2>What I do</h2><ul class="skills">';
    (d.skills || []).forEach(function (s) { h += '<li>' + esc(s) + '</li>'; });
    h += '</ul></div></section>';

    h += '<section id="projects"><span class="mono">Projects</span><div><h2>Selected work</h2><div class="projects">';
    (d.projects || []).forEach(function (p) {
      h += '<article class="proj"><span class="mono">' + esc(p.kind) + '</span><h3>' + esc(p.title) + '</h3><p class="where">' + esc(p.where) + '</p><ul class="tags">';
      (p.tags || []).forEach(function (t) { h += '<li>' + esc(t) + '</li>'; });
      h += '</ul>';
      if (safeUrl(p.link)) h += '<a class="view" href="' + esc(safeUrl(p.link)) + '">View drawing →</a>';
      h += '</article>';
    });
    h += '</div>';
    if (safeUrl(d.github)) h += '<p style="margin-top:16px"><a href="' + esc(safeUrl(d.github)) + '">More drawings on GitHub →</a></p>';
    h += '</div></section>';

    h += '<section id="experience"><span class="mono">Experience</span><div><h2>Career</h2><ul class="jobs">';
    (d.jobs || []).forEach(function (j) {
      h += '<li><div><b>' + esc(j.title) + '</b><br><span class="org">' + esc(j.org) + '</span></div><span class="badge">' + esc(j.badge) + '</span></li>';
    });
    h += '</ul></div></section>';

    h += '<section id="contact"><span class="mono">Contact</span><div><h2>Get in touch</h2><p>' + esc(d.contactNote) + '</p><div>';
    if (d.email) h += '<div class="row"><span class="mono">Email</span><span class="v" id="v-email">' + esc(d.email) + '</span><button class="copy" data-copy="v-email" type="button">Copy</button></div>';
    if (d.phone) {
      h += '<div class="row"><span class="mono">Phone</span><span class="v" id="v-phone">' + esc(d.phone) + '</span><button class="copy" data-copy="v-phone" type="button">Copy</button></div>';
      h += '<div class="row"><span class="mono">WhatsApp</span><span class="v"><a href="https://wa.me/' + esc(digits(d.phone)) + '">Send a message</a></span><span></span></div>';
    }
    if (safeUrl(d.linkedin)) h += '<div class="row"><span class="mono">LinkedIn</span><span class="v"><a href="' + esc(safeUrl(d.linkedin)) + '">' + esc(bare(d.linkedin)) + '</a></span><span></span></div>';
    h += '</div></div></section>';
    h += '<footer>© ' + esc(d.name) + ' · ' + esc(d.role) + '</footer></div>';
    app.innerHTML = h;

    app.querySelectorAll('.copy').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var el = document.getElementById(btn.getAttribute('data-copy'));
        var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500); };
        var fallback = function () { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
        try { navigator.clipboard.writeText(el.textContent.trim()).then(done, fallback); } catch (e) { fallback(); }
      });
    });
  }

  function buildDoc(d) {
    var json = JSON.stringify(d, null, 2).replace(/</g, '\\u003c');
    if (STANDALONE) {
      return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>' + TITLE + '</title>\n<meta name="description" content="Electrical Engineer portfolio">\n<style>' + RESET + '</style>\n' + fontHTML + '\n' + styleHTML +
        '\n</head>\n<body>\n<div id="app"></div>\n<div id="editor" hidden></div>\n<script type="application/json" id="data">\n' + json + '\n</scr' + 'ipt>\n\n' + codeHTML + '\n</body>\n</html>\n';
    }
    var body = '<title>' + TITLE + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + fontHTML + '\n' + styleHTML +
      '\n<div id="app"></div>\n<div id="editor" hidden></div>\n<script type="application/json" id="data">\n' + json + '\n</scr' + 'ipt>\n\n' + codeHTML;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      RESET + '</style></head><body>' + body + '</body></html>';
  }

  // ---------- Owner-only editor ----------
  var draft, artifactNS;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function field(label, value, onInput, rows) {
    var w = el('label', 'f'); w.appendChild(el('span', '', label));
    var i = el(rows ? 'textarea' : 'input'); if (rows) i.rows = rows; i.value = value || '';
    i.addEventListener('input', function () { onInput(i.value); });
    w.appendChild(i); return w;
  }
  function lines(v) { return v.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); }
  function btn(label, cls, fn) { var b = el('button', cls, label); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function move(arr, i, dir) { var j = i + dir; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

  // Crops the picked photo to 4:5 around the centre and shrinks it so it stays small inside the page.
  function resizePhoto(file, cb) {
    var fr = new FileReader();
    fr.onerror = function () { cb(''); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { cb(''); };
      img.onload = function () {
        var tw = 440, th = 550, r = tw / th, sw = img.width, sh = img.height, sx = 0, sy = 0;
        if (sw / sh > r) { var nw = sh * r; sx = (sw - nw) / 2; sw = nw; } else { var nh = sw / r; sy = (sh - nh) / 2; sh = nh; }
        var c = document.createElement('canvas'); c.width = tw; c.height = th;
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, tw, th);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function drawEditor() {
    var keep = editor.scrollTop;
    editor.textContent = '';
    var inner = el('div', 'inner'); editor.appendChild(inner);
    var status = el('span', 'status', STANDALONE ? 'Make your changes, then download the file and upload it to your hosting to publish it.' : 'Make your changes, then press "Save & publish".');
    var bar = el('div', 'bar');
    bar.appendChild(btn(STANDALONE ? 'Download updated file' : 'Save & publish', 'btn', save));
    bar.appendChild(btn('Cancel', 'btn alt', function () { editor.hidden = true; document.body.style.overflow = ''; }));
    bar.appendChild(status);
    inner.appendChild(bar);

    inner.appendChild(el('h2', '', 'Profile'));
    var pw = el('div', 'card');
    pw.appendChild(el('span', 'mono', 'Profile photo (shown on the right)'));
    if (draft.photo) { var im = el('img', 'photo'); im.src = draft.photo; im.alt = ''; pw.appendChild(im); }
    var fi = el('input'); fi.type = 'file'; fi.accept = 'image/*'; fi.id = 'photo-file';
    fi.addEventListener('change', function () {
      var f = fi.files && fi.files[0]; if (!f) return;
      resizePhoto(f, function (url) { if (url) { draft.photo = url; drawEditor(); } else { status.textContent = 'Could not read that image. Try another one.'; } });
    });
    pw.appendChild(fi);
    if (draft.photo) pw.appendChild(btn('Remove photo', 'sm danger', function () { draft.photo = ''; drawEditor(); }));
    inner.appendChild(pw);
    inner.appendChild(field('Name', draft.name, function (v) { draft.name = v; }));
    inner.appendChild(field('Small label at the top', draft.eyebrow, function (v) { draft.eyebrow = v; }));
    inner.appendChild(field('Job title', draft.role, function (v) { draft.role = v; }));
    inner.appendChild(field('Organisation (next to the title)', draft.org, function (v) { draft.org = v; }));
    inner.appendChild(field('Second line', draft.subline, function (v) { draft.subline = v; }));
    inner.appendChild(field('About (leave a blank line between paragraphs)', draft.about.join('\n\n'), function (v) { draft.about = v.split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean); }, 7));

    inner.appendChild(el('h2', '', 'Skills'));
    inner.appendChild(field('One per line', draft.skills.join('\n'), function (v) { draft.skills = lines(v); }, 7));

    inner.appendChild(el('h2', '', 'Projects'));
    draft.projects.forEach(function (p, i) {
      var c = el('div', 'card');
      c.appendChild(field('Type (small label)', p.kind, function (v) { p.kind = v; }));
      c.appendChild(field('Title', p.title, function (v) { p.title = v; }));
      c.appendChild(field('Location / description', p.where, function (v) { p.where = v; }));
      c.appendChild(field('Work done (comma separated)', p.tags.join(', '), function (v) { p.tags = v.split(',').map(function (s) { return s.trim(); }).filter(Boolean); }));
      c.appendChild(field('Drawing link (https://...)', p.link, function (v) { p.link = v; }));
      var a = el('div', 'acts');
      a.appendChild(btn('↑ Up', 'sm', function () { move(draft.projects, i, -1); drawEditor(); }));
      a.appendChild(btn('↓ Down', 'sm', function () { move(draft.projects, i, 1); drawEditor(); }));
      a.appendChild(btn('Delete', 'sm danger', function () { draft.projects.splice(i, 1); drawEditor(); }));
      c.appendChild(a); inner.appendChild(c);
    });
    inner.appendChild(btn('+ New project', 'sm', function () { draft.projects.push({ kind: '', title: 'New project', where: '', tags: [], link: '' }); drawEditor(); }));

    inner.appendChild(el('h2', '', 'Experience'));
    draft.jobs.forEach(function (j, i) {
      var c = el('div', 'card');
      c.appendChild(field('Job title', j.title, function (v) { j.title = v; }));
      c.appendChild(field('Organisation', j.org, function (v) { j.org = v; }));
      c.appendChild(field('Type (Full-time, Remote...)', j.badge, function (v) { j.badge = v; }));
      var a = el('div', 'acts');
      a.appendChild(btn('↑ Up', 'sm', function () { move(draft.jobs, i, -1); drawEditor(); }));
      a.appendChild(btn('↓ Down', 'sm', function () { move(draft.jobs, i, 1); drawEditor(); }));
      a.appendChild(btn('Delete', 'sm danger', function () { draft.jobs.splice(i, 1); drawEditor(); }));
      c.appendChild(a); inner.appendChild(c);
    });
    inner.appendChild(btn('+ New experience', 'sm', function () { draft.jobs.push({ title: '', org: '', badge: '' }); drawEditor(); }));

    inner.appendChild(el('h2', '', 'Contact'));
    inner.appendChild(field('Message', draft.contactNote, function (v) { draft.contactNote = v; }, 3));
    inner.appendChild(field('Email', draft.email, function (v) { draft.email = v; }));
    inner.appendChild(field('Phone / WhatsApp (+880...)', draft.phone, function (v) { draft.phone = v; }));
    inner.appendChild(field('LinkedIn link', draft.linkedin, function (v) { draft.linkedin = v; }));
    inner.appendChild(field('GitHub link', draft.github, function (v) { draft.github = v; }));
    editor.scrollTop = keep;
  }

  function save() {
    var status = editor.querySelector('.status');
    if (STANDALONE) {
      try {
        var blob = new Blob([buildDoc(draft)], { type: 'text/html' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
        document.body.appendChild(a); a.click(); a.remove();
        DATA = JSON.parse(JSON.stringify(draft)); render(DATA);
        status.textContent = 'Downloaded index.html. Upload it to your hosting to publish the changes.';
      } catch (e) { status.textContent = 'Could not create the file. Please try again.'; }
      return;
    }
    status.textContent = 'Saving…';
    artifactNS.publish(buildDoc(draft)).then(function () {
      status.textContent = 'Published. Reloading the page…';
    }, function (err) {
      var c = err && err.code;
      status.textContent = c === 'conflict' ? 'A newer version was published first. Reloading the page.'
        : (c === 'not_writer' || c === 'not_granted') ? 'You do not have permission to edit this page.'
        : c === 'rate_limited' ? 'Please try again in a moment.'
        : 'Could not save. Please try again.';
    });
  }


  // ---- Edit password gate (stores only a salted SHA-256 hash, never the password) ----
  var PW_HASH = 'd33893aa27ba81a1b32990db7330807fe286e6fe06e1e3e298fa7a8a224b14aa', PW_SALT = 'foysal-portfolio-edit:';
  function sha256(str) {
    var utf = unescape(encodeURIComponent(str)), bytes = [], i;
    for (i = 0; i < utf.length; i++) bytes.push(utf.charCodeAt(i));
    var K = [], p = 2, n = 0;
    function frac(x) { return ((x - Math.floor(x)) * 4294967296) | 0; }
    while (n < 64) { var pr = true; for (var d = 2; d * d <= p; d++) if (p % d === 0) { pr = false; break; } if (pr) { K[n++] = frac(Math.cbrt(p)); } p++; }
    var Hh = [], q = 2, m = 0;
    while (m < 8) { var pr2 = true; for (var e = 2; e * e <= q; e++) if (q % e === 0) { pr2 = false; break; } if (pr2) { Hh[m++] = frac(Math.sqrt(q)); } q++; }
    var l = bytes.length * 8; bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
    function rr(x, c) { return (x >>> c) | (x << (32 - c)); }
    for (var o = 0; o < bytes.length; o += 64) {
      var w = [];
      for (i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
      for (i = 16; i < 64; i++) {
        var s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      var a = Hh[0], b = Hh[1], c = Hh[2], dd = Hh[3], ee = Hh[4], f = Hh[5], g = Hh[6], h = Hh[7];
      for (i = 0; i < 64; i++) {
        var S1 = rr(ee, 6) ^ rr(ee, 11) ^ rr(ee, 25), ch = (ee & f) ^ (~ee & g), t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        var S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0;
        h = g; g = f; f = ee; ee = (dd + t1) | 0; dd = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      Hh = [(Hh[0] + a) | 0, (Hh[1] + b) | 0, (Hh[2] + c) | 0, (Hh[3] + dd) | 0, (Hh[4] + ee) | 0, (Hh[5] + f) | 0, (Hh[6] + g) | 0, (Hh[7] + h) | 0];
    }
    return Hh.map(function (x) { return ('00000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
  }
  var pwFails = 0, pwLockUntil = 0;
  function askPassword(onOk) {
    var g = document.getElementById('pw-gate');
    if (!g) {
      g = document.createElement('div'); g.id = 'pw-gate'; g.hidden = true;
      g.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="pw-t"><h3 id="pw-t">Enter password to edit</h3>' +
        '<input id="pw-in" type="password" autocomplete="off" placeholder="Password"><p class="msg" id="pw-msg"></p>' +
        '<div class="acts"><button type="button" class="sm" id="pw-cancel">Cancel</button><button type="button" class="btn" id="pw-ok">Unlock</button></div></div>';
      document.body.appendChild(g);
    }
    var inp = g.querySelector('#pw-in'), msg = g.querySelector('#pw-msg');
    var close = function () { g.hidden = true; inp.value = ''; msg.textContent = ''; };
    var submit = function () {
      var now = Date.now();
      if (now < pwLockUntil) { msg.textContent = 'Too many attempts. Wait ' + Math.ceil((pwLockUntil - now) / 1000) + 's.'; return; }
      if (sha256(PW_SALT + inp.value) === PW_HASH) { pwFails = 0; close(); onOk(); }
      else { pwFails++; inp.value = ''; msg.textContent = 'Wrong password.'; if (pwFails >= 5) { pwLockUntil = Date.now() + 30000; pwFails = 0; } }
    };
    g.querySelector('#pw-ok').onclick = submit;
    g.querySelector('#pw-cancel').onclick = close;
    inp.onkeydown = function (ev) { if (ev.key === 'Enter') submit(); else if (ev.key === 'Escape') close(); };
    g.hidden = false; inp.focus();
  }

  function openEditor() {
    draft = JSON.parse(JSON.stringify(DATA));
    drawEditor(); editor.hidden = false; editor.scrollTop = 0; document.body.style.overflow = 'hidden';
  }

  render(DATA);

  // The edit button appears only for people who can publish this page. Everyone else sees a read-only page.
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function (r) {
      var user = r[0]; artifactNS = r[1];
      if (!user || !artifactNS) return null;
      return user.canEdit();
    }).then(function (ok) {
      if (!ok) return;
      var b = el('button', 'btn edit-fab', 'Edit'); b.type = 'button'; b.id = 'edit-fab';
      b.addEventListener('click', function () { askPassword(openEditor); });
      document.body.appendChild(b);
    }).catch(function () {});
  } else {
    // Downloaded copy: visitors never see the button. Open the page with #edit at the end of its address to show it.
    var showFab = function () {
      if (location.hash !== '#edit' || document.getElementById('edit-fab')) return;
      var b = el('button', 'btn edit-fab', 'Edit'); b.type = 'button'; b.id = 'edit-fab';
      b.addEventListener('click', function () { askPassword(openEditor); });
      document.body.appendChild(b);
    };
    showFab(); window.addEventListener('hashchange', showFab);
  }
})();
